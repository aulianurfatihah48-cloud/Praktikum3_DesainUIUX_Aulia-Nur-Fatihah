<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
    
        html, body {
            width: 100%;
            height: 100%;
            background-color: #FD4DA7;
        }
    
        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }
    
        header {
            background-color: blue;
            padding:20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            border: 1px solid;
        }
    
        nav {
            background-color: green;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
        }
    
        .main-content {
            display: flex;
            gap: 10px;
            flex: 1;
        }
    
        article {
            flex: 3;
            background-color: orange;
            padding: 15px;
            border: 1px solid red;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    
        section {
            background-color: white;
            padding: 15px;
            border: 1px solid grey;
            flex: 1;
            display: flex;
            align-items: center;
        }
    
        aside {
            flex: 1;
            background-color: blue;
            padding: 15px;
            border: 1px solid black;
        }
    
        footer {
            background-color: skyblue;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
        }
    </style>
</head>
<body>

            <aside>

            </aside>
        </div>
  </div>
  
  <footer>

  </footer>
</body>
</html>
